         会被当成普通标记解析，这个 style 就成了真实的样式表并生效；

      <h2>这是什么</h2>
      <p>
        盯盘侠（PanWatch）是一个自托管的股票盯盘助手。H5 版本把它的核心能力搬进了浏览器：
        打开网页就能看持仓、盯自选、设提醒，不需要安装 App。
      </p>
      <p>
        整个应用由原生 HTML、CSS 与 ES Module 组成 —— 没有打包步骤，没有框架，
        没有运行时依赖。三个样式文件加十七个前端脚本就是全部；
        需要后端时，再加四个文件构成的 Cloudflare Worker。
      </p>

      <h2>主要功能</h2>
      <ul>
        <li>
          <strong>多账户持仓</strong> —— 按券商分组，A股 / 港股 / 美股混合持仓，
          自动按汇率折算成人民币市值与盈亏。
        </li>
        <li>
          <strong>AI 评分选股</strong> —— 候选标的按四维评分排序，可按评分、涨幅、风险切换，
          支持按市场筛选，每条附评分理由与风险等级。
        </li>
        <li>
          <strong>价格提醒</strong> —— 条件组合（AND / OR）、生效时段、冷却时间、
          日触发上限、重复模式、多推送渠道，每条规则可独立开关。
        </li>
        <li>
          <strong>个股详情</strong> —— K 线（MA5/10/20 与成交量）、五项技术指标共振信号灯、
          支撑压力位，以及以七步推理链形式呈现的 AI 分析。
        </li>
        <li>
          <strong>模拟盘</strong> —— 策略净值曲线对比基准，四档时间区间，
          六项绩效指标（年化收益、最大回撤、夏普比率、胜率等）。
        </li>
        <li>
          <strong>深色模式</strong> —— 浅色与深色两套设计令牌，可跟随系统或手动切换，
          偏好保存在本机浏览器。
        </li>
        <li>
          <strong>可安装为 PWA</strong> —— 带 manifest 与 Service Worker，
          可添加到手机主屏并离线打开。
        </li>
      </ul>

      <h2>数据说明</h2>
      <p>
        数据有两个来源，页面顶栏会明确标出当前用的是哪一个 ——
        「实时」和「演示」长得不一样。
      </p>
      <p>
        <strong>配了后端时</strong>，一个 Cloudflare Worker 从腾讯财经拉取
        A股、港股、美股的实时行情，缓存进 D1（托管的 SQLite）并按 15 秒的有效期刷新；
        持仓、自选、提醒这些用户数据也持久化在 D1 里。行情仅供参考，不构成投资建议。
      </p>
      <p>
        <strong>没有后端时</strong>，站点按纯静态模式运行，不联网，
        <strong>界面内所有行情、持仓、AI 评分与投资结论都是内置的演示数据</strong>，
        由确定性伪随机序列生成，不来自任何真实行情源，不随市场变化。
        这种模式下把其中任何一个数字当成实时行情，都会得出错误结论。
      </p>

      <h2>技术栈</h2>
      <ul>
        <li>原生 HTML / CSS / ES Module，无构建步骤、无框架、无运行时依赖</li>
        <li>手写 SVG 图表（面积图、K 线、环形图、迷你走势图），零图表库</li>
        <li>
          设计令牌按角色拆分：每个色相分成填充底、文字色、胶囊文字、胶囊底四个独立令牌，
          各自独立满足对比度要求
        </li>
        <li>全部配色按 WCAG 2.1 验算，88 组受判定组合全部达到 AA 标准</li>
        <li>Service Worker 预缓存，支持离线打开</li>
        <li>
          可选后端：Cloudflare Worker + D1（托管的 SQLite），静态资源与 API
          属于同一次部署，不需要另外找服务器
        </li>
        <li>
          前端与 Worker 共用同一个 js/symbols.js 模块，
          「股票代码 ↔ 上游行情代码」的换算只有一处定义
        </li>
        <li>可部署到 Cloudflare Workers：纯静态托管，或加上 Worker + D1 后端</li>
      </ul>

      <h2>常见问题</h2>
      <dl>
        <dt>盯盘侠 PanWatch H5 需要服务器或数据库吗？</dt>
        <dd>看怎么用。默认部署是纯静态站点，没有后端，数据全部内置；再配上一个 Cloudflare Worker 与 D1 数据库，它就会拉取真实行情，并把持仓、自选、提醒持久化进 D1。两种模式共用同一份前端代码，没探测到后端时会自动回落到演示数据。</dd>

        <dt>它连接真实的行情数据源吗？</dt>
        <dd>配了后端就连接。Worker 从腾讯财经拉取 A股、港股、美股的实时行情，缓存进 D1 并按 15 秒的有效期刷新；页面顶栏会明确标出当前显示的是「实时」还是「演示」。没有后端时不联网，所有数字都是内置的演示数据。</dd>

        <dt>支持哪些股票市场？</dt>
        <dd>A股、港股、美股。多币种持仓会按内置汇率折算成人民币，统一计算市值与盈亏。</dd>

        <dt>为什么界面配色是灰调的？</dt>
        <dd>色板取自莫兰迪静物画的灰调，所有颜色都掺入一层暖灰并压低饱和度。涨跌仍严格遵循中国市场习惯：涨红跌绿。全部配色按 WCAG 2.1 验算过对比度。</dd>

        <dt>可以自己部署吗？</dt>
        <dd>可以。项目以 MIT 许可开源，一条 wrangler 命令即可部署到 Cloudflare Workers；要用实时行情，再建一个 D1 数据库并跑一次建表脚本。</dd>
      </dl>

      <h2>来源与许可</h2>
      <p>
        H5 版本基于
        <a href="https://github.com/jackhuo2/PanWatch" rel="noopener">jackhuo2/PanWatch</a>
        改造，源码在
        <a href="https://github.com/KKfox100/PanWatch-H5" rel="noopener">KKfox100/PanWatch-H5</a>，
