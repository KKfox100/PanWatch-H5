<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efece6">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no,email=no,address=no">

  <title>盯盘侠 PanWatch H5 · AI 盯盘助手</title>
  <meta name="description"
        content="盯盘侠 PanWatch 的移动端 H5 版本 —— 自托管 AI 盯盘助手，A股/港股/美股持仓管理、AI 评分选股、价格提醒，莫兰迪配色。">

  <!-- PWA -->
  <link rel="manifest" href="./public/manifest.json">
  <link rel="icon" type="image/svg+xml" href="./public/icon.svg">
  <link rel="apple-touch-icon" href="./public/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="盯盘侠">

  <!-- 主题色防闪：在 CSS 加载前就把 data-theme 定好，避免白屏跳色 -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('panwatch-h5:v1');
        var t = raw ? (JSON.parse(raw).theme || 'auto') : 'auto';
        var dark = t === 'dark' ||
          (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <div id="app">
    <!-- 首屏骨架，JS 接管后会被替换 -->
    <header class="appbar">
      <div class="appbar__inner">
        <div class="brand">
          <span class="brand__mark"></span>
          <span class="brand__name">盯盘侠</span>
          <span class="brand__ver">H5</span>
        </div>
      </div>
    </header>
    <main class="page">
      <div class="skel" style="height:22px;width:40%;margin-bottom:14px"></div>
      <div class="stat-grid">
        <div class="skel" style="height:78px"></div>
        <div class="skel" style="height:78px"></div>
        <div class="skel" style="height:78px"></div>
        <div class="skel" style="height:78px"></div>
      </div>
      <div class="skel" style="height:150px;margin-top:14px"></div>
    </main>
  </div>

  <noscript>
    <div style="padding:40px 20px;text-align:center;font-family:sans-serif">
      盯盘侠 H5 需要启用 JavaScript 才能运行。
    </div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
